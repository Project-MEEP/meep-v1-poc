[package]
name = "meep-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Domain and ports: no I/O, web or database crates (PLAN-13).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.4.1"
sha2 = "0.11.1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rand = "0.10.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
zeroize = "1"

[dev-dependencies]
# The fakes tests need the `testing` feature; a dev-only edge, so a release build never sees it (FOUND-07).
meep-core = { path = ".", version = "0.0.0", features = ["testing"] }
proptest = "1.12.0"
time = { version = "0.3", features = ["macros"] }

[features]
# In-memory fakes for specs 001 and 010 (BUILD-01); never in a release build (FOUND-07).
testing = []
# Crash hooks for the failpoint tests (PLAN-18).
failpoints = []
