[package]
name = "meep-storage"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
meep-core = { path = "../meep-core", version = "0.0.0" }
keyring = "4.2.0"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.1"
zeroize = "1"
rand = "0.10.4"
subtle = "2"
data-encoding = "2"
tempfile = "3"

# SQLCipher: vendored OpenSSL on Windows, bundled elsewhere pending the macOS and Linux check (T034).
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher-vendored-openssl"] }

[target.'cfg(not(windows))'.dependencies]
rusqlite = { version = "0.43.0", features = ["bundled-sqlcipher"] }

[features]
# Test-only features: never default, never in a release build or artifact (FOUND-07).
plaintext-test-store = []
in-memory-key-store = []
