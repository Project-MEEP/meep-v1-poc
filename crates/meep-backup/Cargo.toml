[package]
name = "meep-backup"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
meep-core = { path = "../meep-core", version = "0.0.0" }
zip = { version = "9.8.0", default-features = false, features = ["deflate"] }
