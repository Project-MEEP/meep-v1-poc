name: advisories

# VZ-01 item 1: new advisories appear after a merge, so main is re-checked every day.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('Cargo.toml') != ''
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check advisories
      - if: hashFiles('Cargo.toml') == ''
        run: echo "No Cargo.toml yet; advisory check skipped."
