name: CI

# ENG-02 / ENG-03: runs on every push to any branch and every pull request to main.
# Rust jobs, including the Windows build, are skipped until a Cargo.toml exists (the workspace is not scaffolded yet).
on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Secret, data and personal-info guard
        run: bash .github/scripts/guard.sh
      - name: Injection and logging checks (SEC-05, LOG-01)
        run: |
          bash .github/scripts/check-sec05.sh
          bash .github/scripts/check-logging.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - if: hashFiles('Cargo.toml') != ''
        run: cargo fmt --all --check
      - if: hashFiles('Cargo.toml') != ''
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: hashFiles('Cargo.toml') == ''
        run: echo "No Cargo.toml yet; lint skipped."

  deps:
    name: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('Cargo.toml') != ''
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
      - if: hashFiles('Cargo.toml') == ''
        run: echo "No Cargo.toml yet; cargo-deny skipped."

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace
      - if: hashFiles('Cargo.toml') != ''
        run: cargo test -p meep-storage --features plaintext-test-store
      - if: hashFiles('Cargo.toml') == ''
        run: echo "No Cargo.toml yet; unit tests skipped."

  build-windows:
    name: build-windows
    runs-on: windows-latest
    # The owner runs Windows: catch Windows-only failures (for example the vendored OpenSSL
    # build and path-length limits for the SQLCipher dependency, PLAN-14).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('Cargo.toml') != ''
        run: git config --global core.longpaths true
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - if: hashFiles('Cargo.toml') != ''
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: hashFiles('Cargo.toml') != ''
        run: cargo build --workspace --all-targets
      - if: hashFiles('Cargo.toml') != ''
        run: cargo test --workspace
      - if: hashFiles('Cargo.toml') == ''
        run: echo "No Cargo.toml yet; Windows build skipped."

  release-features:
    name: release-features
    runs-on: ubuntu-latest
    # FOUND-07: test-only cargo features must never be compiled into a release build or artifact.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: bash .github/scripts/check-release-features.sh

  forbid-unsafe:
    name: forbid-unsafe
    runs-on: ubuntu-latest
    # VZ-01 item 2: no unsafe code in any Meep crate.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: bash .github/scripts/check-forbid-unsafe.sh

  ai-security-review:
    name: ai-security-review
    runs-on: ubuntu-latest
    # VZ-02 (a): first reviewer, Claude Code Action. Enforcing once AI_REVIEW_ENFORCE=true; report-only before.
    # Uses the pull_request event (not pull_request_target), so fork pull requests get no secrets and no write access.
    # The prompt is read from the BASE commit so a pull request cannot rewrite its own reviewer.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan
        id: plan
        run: bash .github/scripts/ai-review-plan.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'yes' || '' }}
      - name: Load the base-commit prompt
        id: prompt
        if: steps.plan.outputs.run == 'true'
        run: |
          {
            echo 'text<<PROMPT_EOF'
            cat "$RUNNER_TEMP/review-prompt.md"
            echo
            echo "Base commit: $BASE_SHA"
            echo "Head commit: $HEAD_SHA"
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Claude Code review
        id: claude
        if: steps.plan.outputs.run == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@eb56b6666facdbd501035f4a0269d8caee2e7a8b # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: "dependabot[bot]"
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --max-turns 25
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
            --json-schema '{"type":"object","required":["findings"],"properties":{"findings":{"type":"array","items":{"type":"object","required":["severity","file","summary"],"properties":{"severity":{"enum":["critical","high","medium","low","info"]},"file":{"type":"string"},"summary":{"type":"string"}}}}}}'
      - name: Gate
        run: bash .github/scripts/ai-review-gate.sh
        env:
          PLAN_RUN: ${{ steps.plan.outputs.run }}
          PLAN_REASON: ${{ steps.plan.outputs.reason }}
          ACTION_OUTCOME: ${{ steps.claude.outcome }}
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
          AI_REVIEW_ENFORCE: ${{ vars.AI_REVIEW_ENFORCE }}

  agent-rules:
    name: agent-rules
    runs-on: ubuntu-latest
    # VZ-02 (c): CLAUDE.md and AGENTS.md carry identical shared rules.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/check-agent-rules-sync.sh

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    # VZ-02: non-AI baseline. Free for public repositories. Rust runs once a Cargo.toml exists.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        run: |
          if [ "${{ matrix.language }}" = "rust" ] && [ ! -f Cargo.toml ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.run == 'true' && matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - if: steps.gate.outputs.run == 'true'
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
      - if: steps.gate.outputs.run != 'true'
        run: echo "No Cargo.toml yet; CodeQL for Rust skipped."

  acceptance-domain:
    name: acceptance-domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: hashFiles('Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # Given/When/Then tests from the AT list; wired up once the first feature lands.
      - if: hashFiles('Cargo.toml') != ''
        run: cargo test -p meep-acceptance --test acceptance --no-fail-fast
      - if: hashFiles('Cargo.toml') == ''
        run: echo "No Cargo.toml yet; domain acceptance skipped."

  acceptance-web:
    name: acceptance-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Real-browser tests in both themes with WCAG 2.2 AA checks (AT-41, AT-42);
      # added with the web screens.
      - run: echo "No web screens yet; web acceptance skipped."

  all-green:
    name: all-green
    if: always()
    needs: [guard, lint, deps, unit, build-windows, release-features, forbid-unsafe, ai-security-review, agent-rules, codeql, acceptance-domain, acceptance-web]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "A job did not succeed."; exit 1; fi
          done
