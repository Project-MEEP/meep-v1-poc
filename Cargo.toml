# Project MEEP workspace (spec 002 T001, PLAN-13, ENG-01).
# Keep the repository and its target folder path at 121 characters or fewer (research.md).
[workspace]
resolver = "3"
members = [
  "crates/meep-core",
  "crates/meep-storage",
  "crates/meep-backup",
  "crates/meep-web",
  "tests/acceptance",
]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

# Clippy warnings are errors in CI (cargo clippy -- -D warnings); unsafe code is forbidden (VZ-01).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
