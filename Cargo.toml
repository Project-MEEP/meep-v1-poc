# Project MEEP workspace (spec 002 T001, PLAN-13, ENG-01).
# Keep the repository and its target folder path at 121 characters or fewer (research.md).
[workspace]
resolver = "3"
members = [
  "crates/meep-core",
  "crates/meep-storage",
  "crates/meep-backup",
  "crates/meep-web",
  "tests/acceptance",
]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

# Clippy warnings are errors in CI (cargo clippy -- -D warnings); unsafe code is forbidden (VZ-01).
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# ERR-01 item 1: no panics in product code. Tests may (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# ERR-01 item 1: a panic in a release build ends the process; the panic hook writes only a fixed code.
[profile.release]
panic = "abort"
